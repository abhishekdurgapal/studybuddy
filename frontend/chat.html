<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Group Chat</h2>

<div id="chat" class="chat-box"></div>

<input id="msg" placeholder="Type message">
<button id="sendBtn">Send</button>

<script src="https://studybuddy-lnsx.onrender.com/socket.io/socket.io.js"></script>

<script>

const API =
  "https://studybuddy-lnsx.onrender.com";

const socket =
  io("https://studybuddy-lnsx.onrender.com");

const groupId =
  localStorage.getItem("groupId");

const senderName =
  localStorage.getItem("name") || "User";


// JOIN ROOM
socket.on("connect", () => {

  console.log(
    "Connected:",
    socket.id
  );

  socket.emit(
    "joinRoom",
    groupId
  );

});


// LOAD OLD MESSAGES
async function loadMessages() {

  const res =
    await fetch(
      `${API}/api/messages/${groupId}`
    );

  const data =
    await res.json();

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  data.forEach(msg => {

    chat.innerHTML += `
      <div class="message">
        <b>${msg.senderName || "Unknown"}:</b>
        ${msg.message}
      </div>
    `;

  });

}


// SEND MESSAGE
document
.getElementById("sendBtn")
.addEventListener("click", () => {

  const input =
    document.getElementById("msg");

  const message =
    input.value.trim();

  if (!message) return;

  socket.emit(
    "sendMessage",
    {
      groupId,
      senderName,
      message
    }
  );

  input.value = "";

});


// RECEIVE MESSAGE
socket.on(
  "receiveMessage",
  (data) => {

    const chat =
      document.getElementById("chat");

    chat.innerHTML += `
      <div class="message">
        <b>${data.senderName}:</b>
        ${data.message}
      </div>
    `;

  }
);


// INITIAL LOAD
loadMessages();

</script>

</body>
</html>
